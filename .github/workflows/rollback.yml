name: Rollback

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SITE_URL: https://cellestial.ru

jobs:
  rollback:
    name: Rollback
    if: github.repository == 'Cringe-Driven-Development-Team/frontend' && github.ref == 'refs/heads/main' && vars.PRODUCTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    # указатель релиза меняет кто-то один: группа общая с CD. Очереди в ней нет — ожидает
    # один запуск, более новый его вытесняет (README, «Выкатка»)
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
      CDN_URL: ${{ vars.CDN_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x
      - run: bun install --frozen-lockfile
      - name: Find previous release
        id: previous
        run: bun run release previous
      # как и в выкатке, релиз проверяется до переключения
      - name: Release check
        id: check
        env:
          SHA: ${{ steps.previous.outputs.sha }}
        run: bun run release check "$SHA"
      - name: Switch release pointer
        id: switch
        env:
          SHA: ${{ steps.previous.outputs.sha }}
        run: bun run release rollback "$SHA"
      - name: Health check
        id: health
        env:
          SHA: ${{ steps.previous.outputs.sha }}
        run: bun run release health "$SHA"
      - name: Send to tg
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ vars.TELEGRAM_RELEASES_TOPIC_ID }}
          TELEGRAM_USER_MAP: ${{ vars.TELEGRAM_USER_MAP }}
          STATUS: ${{ job.status }}
          SHA: ${{ steps.previous.outputs.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_BEFORE_SHA: ${{ steps.switch.outputs.before_sha || steps.previous.outputs.before_sha }}
          RELEASE_INDEX_PUBLISHED: ${{ steps.switch.outputs.index_published }}
          RELEASE_PREVIOUS_STATUS: ${{ steps.previous.outcome }}
          RELEASE_CHECK_STATUS: ${{ steps.check.outcome }}
          RELEASE_SWITCH_STATUS: ${{ steps.switch.outcome }}
          RELEASE_HEALTH_STATUS: ${{ steps.health.outcome }}
        run: bun run release notify Откат "$STATUS" "$SHA"
