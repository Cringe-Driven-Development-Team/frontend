# Локальный запуск BFF из образа с заглушкой Go (docs/local-development.md, «BFF»):
#   bun run image
#   SESSION_KEY=$(openssl rand -base64 32) docker compose -f apps/bff/compose.yml up -d
name: cdd-bff

services:
    # Заглушка Go по целевому контракту; порты не публикуются, служебные ручки —
    # docker compose -f apps/bff/compose.yml exec go-stub wget -qO- 127.0.0.1:8080/__stub/stats
    go-stub:
        image: oven/bun:1.4.4-alpine
        working_dir: /stub
        command: ['bun', 'go-stub.ts']
        environment:
            STUB_PORT: '8080'
            STUB_ACCESS_TTL: '10'
        volumes:
            - ./dev:/stub:ro
        healthcheck:
            test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/health']
            interval: 2s
            timeout: 2s
            retries: 15

    bff:
        image: cdd-bff:local
        environment:
            SESSION_KEY: ${SESSION_KEY:?SESSION_KEY is required, e.g. openssl rand -base64 32}
            APP_ORIGIN: http://localhost:3000
            GO_API_URL: http://go-stub:8080/api/v1
        depends_on:
            go-stub:
                condition: service_healthy
        ports:
            - '127.0.0.1:3000:3000'
        stop_grace_period: 15s
